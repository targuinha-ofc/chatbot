<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulte endereços brasileiros usando seu CEP.">
    <title>Consulta de CEP | ViaCEP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-shell">
        <section class="intro" aria-labelledby="page-title">
            <p class="eyebrow">Pesquisa de endereço</p>
            <h1 id="page-title">Encontre um endereço pelo CEP.</h1>
            <p class="intro-copy">Digite um CEP brasileiro para consultar logradouro, bairro, cidade e estado em poucos segundos.</p>
            <p class="source-note"><span class="status-dot" aria-hidden="true"></span>Dados consultados em tempo real via ViaCEP</p>
        </section>

        <section class="lookup-panel" aria-label="Consulta de CEP">
            <form id="cep-form" novalidate>
                <label for="cep">CEP</label>
                <div class="search-row">
                    <input id="cep" name="cep" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="9" placeholder="00000-000" aria-describedby="cep-hint cep-error">
                    <button type="submit" id="search-button">
                        <span>Buscar CEP</span>
                        <span class="button-arrow" aria-hidden="true">&#8599;</span>
                    </button>
                </div>
                <p id="cep-hint" class="field-hint">Informe os 8 números do CEP</p>
                <p id="cep-error" class="message error" role="alert" hidden></p>
            </form>

            <div id="resultado" class="result-area" aria-live="polite" aria-busy="false">
                <div class="empty-state">
                    <span class="empty-icon" aria-hidden="true">&#8962;</span>
                    <p>O endereço consultado aparecerá aqui.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>Consulta de CEP <span aria-hidden="true">&#183;</span> ViaCEP</footer>
    <script src="script.js"></script>
</body>
</html>
