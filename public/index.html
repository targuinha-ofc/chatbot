<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Converse com um agente de IA com memória persistente.">
    <title>Campo Aberto | Agente de IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
    <section class="auth-screen" id="auth-screen" aria-labelledby="auth-title">
        <div class="auth-card">
            <p class="eyebrow">Acesso protegido</p>
            <h1 id="auth-title">Entre no Campo Aberto.</h1>
            <p class="auth-copy">Crie seu acesso para conversar com memória privada e persistente.</p>
            <div class="auth-tabs" role="tablist" aria-label="Autenticação">
                <button class="auth-tab active" id="login-tab" type="button">Entrar</button>
                <button class="auth-tab" id="register-tab" type="button">Criar conta</button>
            </div>
            <form id="auth-form">
                <label id="name-label" for="auth-name" hidden>Nome</label>
                <input id="auth-name" type="text" placeholder="Seu nome" autocomplete="name" hidden>
                <label for="auth-email">E-mail</label>
                <input id="auth-email" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
                <label for="auth-password">Senha</label>
                <input id="auth-password" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="current-password" required>
                <button class="auth-submit" type="submit" id="auth-submit">Entrar</button>
            </form>
            <p class="auth-status" id="auth-status" role="alert" hidden></p>
        </div>
    </section>

    <main class="app-shell" id="chat-app" hidden>
        <header class="topbar">
            <div>
                <p class="eyebrow">Agente com memória</p>
                <h1>Campo Aberto</h1>
            </div>
            <div class="topbar-actions">
                <button class="clear-button" id="clear-button" type="button">Limpar conversa</button>
                <button class="logout-button" id="logout-button" type="button">Sair</button>
            </div>
        </header>
        <section class="chat-panel" aria-label="Conversa com o agente">
            <div class="conversation" id="conversation" aria-live="polite">
                <div class="welcome-message">
                    <span class="welcome-mark" aria-hidden="true">+</span>
                    <h2>Qual é a jogada?</h2>
                    <p>Faça uma pergunta e eu recupero o contexto das nossas conversas anteriores.</p>
                </div>
            </div>
            <form class="composer" id="chat-form">
                <label class="sr-only" for="question">Sua pergunta</label>
                <textarea id="question" name="question" rows="1" placeholder="Escreva sua pergunta..." required></textarea>
                <button type="submit" id="send-button" aria-label="Enviar pergunta">Enviar <span aria-hidden="true">&#8599;</span></button>
            </form>
            <p class="status-line" id="status-line">Memória sincronizada com o MongoDB Atlas</p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
